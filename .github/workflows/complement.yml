name: Complement tests

permissions:
  contents: read

env:
  # Audit the selected tests and local overlay against a reproducible API.
  COMPLEMENT_REVISION: 78516f9174a7c50c9a35a158fe88d16c5d9b88f5
  SYNAPSE_REVISION: 217e4c0f48e01db000127ed9bfb5251eefc51a2c

on:
  workflow_call:
    inputs:
      require_clean_suite:
        type: boolean
        default: true
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.rs'
      - '**.sh'
      - 'tests/mixed_federation*.py'
      - 'tests/complement_regressions*.py'
      - 'tests/complement_baseline*.py'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'crates/data/migrations/**'
      - 'tests/complement/**'
      - '.github/workflows/complement.yml'
  push:
    branches:
      - main
    paths:
      - '**.rs'
      - '**.sh'
      - 'tests/mixed_federation*.py'
      - 'tests/complement_regressions*.py'
      - 'tests/complement_baseline*.py'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'crates/data/migrations/**'
      - 'tests/complement/**'
      - '.github/workflows/complement.yml'
  workflow_dispatch:
    inputs:
      require_clean_suite:
        description: Require zero Complement failures and successful Go exit
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  revised-presence:
    name: Revised presence federation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Prepare pinned Complement and presence tests
        run: |
          git init /tmp/complement
          git -C /tmp/complement remote add origin https://github.com/matrix-org/complement.git
          git -C /tmp/complement fetch --depth 1 origin "$COMPLEMENT_REVISION"
          git -C /tmp/complement checkout --detach FETCH_HEAD
          mkdir -p /tmp/complement/tests/palpo_revised_presence
          cp tests/complement/revised_presence/*_test.go /tmp/complement/tests/palpo_revised_presence/
          cd /tmp/complement
          go test -c -o /tmp/revised-presence.test ./tests/palpo_revised_presence
      - uses: docker/setup-buildx-action@v4
      - name: Build MSC4532-enabled Palpo
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tests/complement/Dockerfile.github
          build-args: PALPO_FEATURES=unstable-msc4532
          tags: complement-palpo-revised-presence
          load: true
          cache-from: type=gha,scope=revised-presence
          cache-to: type=gha,mode=max,scope=revised-presence
      - name: Record revised presence provenance
        run: bash tests/complement-provenance.sh /tmp/complement complement-palpo-revised-presence /tmp/revised-presence-provenance.txt unstable-msc4532

      - name: Require all revised presence federation tests to pass
        run: |
          cd /tmp/complement
          COMPLEMENT_BASE_IMAGE=complement-palpo-revised-presence \
            go test -p=1 -parallel=1 -count=1 -timeout 10m -json ./tests/palpo_revised_presence \
            | tee /tmp/revised-presence-results.jsonl
      - name: Upload revised presence results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: revised-presence-results
          path: |
            /tmp/revised-presence-results.jsonl
            /tmp/revised-presence-provenance.txt
          if-no-files-found: warn
          retention-days: 14

  complement:
    name: Complement
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Test required regression results gate
        run: python3 -m unittest discover -s tests -p 'complement_*test.py'

      - name: Clone Complement
        run: |
          git init /tmp/complement
          git -C /tmp/complement remote add origin https://github.com/matrix-org/complement.git
          git -C /tmp/complement fetch --depth 1 origin "$COMPLEMENT_REVISION"
          git -C /tmp/complement checkout --detach FETCH_HEAD

      - name: Apply audited Complement registration handshake
        run: |
          git -C /tmp/complement apply --check "$GITHUB_WORKSPACE/tests/complement/patches/registration-uiaa.patch"
          git -C /tmp/complement apply "$GITHUB_WORKSPACE/tests/complement/patches/registration-uiaa.patch"
          cd /tmp/complement
          go test ./internal/instruction -count=1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build complement-palpo image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tests/complement/Dockerfile.github
          tags: complement-palpo
          load: true
          cache-from: type=gha,scope=complement
          cache-to: type=gha,mode=max,scope=complement

      - name: Record executable and source provenance
        run: bash tests/complement-provenance.sh /tmp/complement complement-palpo /tmp/complement/provenance.txt default

      - name: Run Complement tests
        id: complement-tests
        run: |
          cd /tmp/complement
          # Use clean deployments so stopped-server backoff cannot affect later tests.
          set +e
          COMPLEMENT_BASE_IMAGE=complement-palpo \
            go test -p=1 -parallel=1 -tags="palpo_blacklist" -json -count=1 -timeout 120m \
            ./tests/csapi \
            ./tests \
            ./tests/msc3930 \
            ./tests/msc3967 2>&1 \
            | tee results.jsonl
          statuses=("${PIPESTATUS[@]}")
          status=${statuses[0]}
          if [ "${statuses[1]}" -ne 0 ]; then status=${statuses[1]}; fi
          echo "$status" > exit-code
          exit "$status"
        continue-on-error: true

      - name: Generate sorted test results
        if: always()
        run: |
          cd /tmp/complement
          grep '^{' results.jsonl \
            | jq -c 'select(.Test != null and (.Action == "pass" or .Action == "fail" or .Action == "skip")) | {Action: .Action, Test: .Test}' \
            > _raw_results.jsonl
          jq -sc 'sort_by(
            (if .Action == "fail" then 0 elif .Action == "skip" then 1 else 2 end),
            .Test
          )[]' _raw_results.jsonl > __test_all.result.jsonl
          grep '^{' results.jsonl \
            | jq -r 'select(.Output != null) | .Output' > results.log
          rm -f _raw_results.jsonl
          echo "=== Go test events (including parent tests) ==="
          echo "Total events: $(wc -l < __test_all.result.jsonl)"
          echo "Pass events:  $(grep -c '"pass"' __test_all.result.jsonl || true)"
          echo "Fail events:  $(grep -c '"fail"' __test_all.result.jsonl || true)"
          echo "Skip events:  $(grep -c '"skip"' __test_all.result.jsonl || true)"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: complement-results
          path: |
            /tmp/complement/__test_all.result.jsonl
            /tmp/complement/results.jsonl
            /tmp/complement/results.log
            /tmp/complement/exit-code
            /tmp/complement/provenance.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Verify required regression cases
        if: always()
        env:
          REQUIRE_CLEAN_SUITE: ${{ inputs.require_clean_suite }}
        run: |
          args=()
          if [ "$REQUIRE_CLEAN_SUITE" = "true" ]; then
            args+=(--require-clean)
          fi
          python3 tests/complement_regressions.py /tmp/complement/results.jsonl \
            tests/complement/required_pass --exit-code-file /tmp/complement/exit-code "${args[@]}"

      - name: Require zero failures and the exact skip baseline
        if: always()
        run: |
          python3 tests/complement_baseline.py /tmp/complement/results.jsonl \
            tests/complement/suite-baseline.json --revision "$COMPLEMENT_REVISION" \
            --exit-code-file /tmp/complement/exit-code

  mixed-federation:
    name: Mixed federation
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test mixed federation results gate
        run: python3 -m unittest discover -s tests -p 'mixed_federation*_test.py'

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Clone Complement
        run: |
          git init /tmp/complement
          git -C /tmp/complement remote add origin https://github.com/matrix-org/complement.git
          git -C /tmp/complement fetch --depth 1 origin "$COMPLEMENT_REVISION"
          git -C /tmp/complement checkout --detach FETCH_HEAD

      - name: Clone pinned Synapse
        run: |
          git init /tmp/synapse
          git -C /tmp/synapse remote add origin https://github.com/element-hq/synapse.git
          git -C /tmp/synapse fetch --depth 1 origin "$SYNAPSE_REVISION"
          git -C /tmp/synapse checkout --detach FETCH_HEAD
          test "$(git -C /tmp/synapse rev-parse HEAD)" = "$SYNAPSE_REVISION"

      - name: Apply audited Complement registration handshake
        run: |
          git -C /tmp/complement apply --check "$GITHUB_WORKSPACE/tests/complement/patches/registration-uiaa.patch"
          git -C /tmp/complement apply "$GITHUB_WORKSPACE/tests/complement/patches/registration-uiaa.patch"
          cd /tmp/complement
          go test ./internal/instruction -count=1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build complement-palpo image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tests/complement/Dockerfile.github
          tags: complement-palpo
          load: true
          cache-from: type=gha,scope=complement
          cache-to: type=gha,mode=max,scope=complement

      - name: Build complement-synapse image
        run: |
          docker build -t matrixdotorg/synapse:latest -f /tmp/synapse/docker/Dockerfile /tmp/synapse
          docker build -t matrixdotorg/synapse-workers:latest -f /tmp/synapse/docker/Dockerfile-workers /tmp/synapse
          docker build -t complement-synapse-base -f /tmp/synapse/docker/complement/Dockerfile /tmp/synapse/docker/complement
          docker build -t complement-synapse -f tests/complement/Dockerfile.synapse tests/complement

      - name: Record pinned peer and executable provenance
        run: bash tests/complement-provenance.sh /tmp/complement complement-palpo /tmp/mixed-federation-results/provenance.txt default /tmp/synapse

      - name: Run mixed federation tests
        id: mixed-federation-tests
        run: |
          bash tests/complement-mixed-federation.sh /tmp/complement /tmp/mixed-federation-results
        continue-on-error: true

      - name: Upload mixed federation test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mixed-federation-results
          path: /tmp/mixed-federation-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Evaluate mixed federation test results
        if: always()
        run: python3 tests/mixed_federation_results.py /tmp/mixed-federation-results
