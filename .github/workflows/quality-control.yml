name: Quality control

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.rs'                 # only execute on changes to go files
      - '**/Cargo.toml'         # or dependency updates
      - 'Cargo.lock'            # or lockfile updates
      - 'crates/data/migrations/**'
      - 'deny.toml'             # or supply-chain policy changes
      - 'tests/security/**'
      - 'tests/dependency_policy*.py'
      - 'tests/complement/**'   # keep all gates current on federation-test fixes
      - '.github/workflows/**'  # or workflow changes
  push:
    branches:
      - main
    paths:
      - '**.rs'                 # only execute on changes to go files
      - '**/Cargo.toml'         # or dependency updates
      - 'Cargo.lock'            # or lockfile updates
      - 'crates/data/migrations/**'
      - 'deny.toml'             # or supply-chain policy changes
      - 'tests/security/**'
      - 'tests/dependency_policy*.py'
      - 'tests/complement/**'   # keep all gates current on federation-test fixes
      - '.github/workflows/**'  # or workflow changes

jobs:
  typos:
    name: Check typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Typos check with custom config file
        uses: crate-ci/typos@v1.52.0

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate advisory exception policy
        run: |
          python3 -m unittest discover -s tests -p 'dependency_policy_test.py'
          python3 tests/dependency_policy.py
      # Feature unification is configured in deny.toml ([graph] all-features).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: ""
          # Keep vulnerabilities and unsoundness blocking; informational debt is visible.
          command-arguments: --warn notice --warn unmaintained

  lint:
    name: Rustfmt and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustfmt.toml enables unstable options (unstable_features = true),
      # which only nightly rustfmt honors.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt
      - uses: dtolnay/rust-toolchain@master
        with:
          # Rust 1.99 falsely lints Diesel's generated QueryableByName code:
          # https://github.com/rust-lang/rust-clippy/issues/17525
          # Keep linting strict; the build/test job below still uses latest stable.
          toolchain: 1.98.1
          components: clippy

      - name: Install dependencies
        run: "sudo apt update && sudo apt install -y --no-install-recommends libclang-dev libpq-dev cmake"

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  release:
    name: Cargo check release - x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install dependencies
        run: "sudo apt update && sudo apt install -y --no-install-recommends libclang-dev libpq-dev cmake"

      - name: Check release build
        run: cargo check --all --bins --examples --tests --release

  test:
    strategy:
        fail-fast: false
        matrix:
          version:
            - stable
    name: Cargo check ${{ matrix.version }} - x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    env:
      # Test binaries do not need DWARF in CI. Keeping it out of both profiles prevents the
      # workspace suite and the differently unified database suite from exhausting runner disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.version }}
          components: rustfmt, clippy

      - name: Install dependencies
        run: "sudo apt update && sudo apt install -y --no-install-recommends libclang-dev libpq-dev cmake postgresql postgresql-contrib"

      - name: Check build
        run: cargo check --all --bins --examples --tests

      - name: Cargo test
        timeout-minutes: 40
        run: cargo test --all --all-features --no-fail-fast -- --nocapture

      - name: PostgreSQL regression tests
        env:
          PALPO_TEST_DATABASE_URL: postgres://palpo_test:palpo_test@localhost/palpo_test
        run: |
          # Cargo filters by substring across the full qualified name. Review
          # cases own globals and must stay in the separate exact-name batch.
          shared_tests="$(cargo test -p palpo --all-features database_ -- --list --ignored)"
          if grep -F '::review_' <<< "$shared_tests"; then
            echo "::error::An isolated review case matches the shared database batch"
            exit 1
          fi
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE palpo_test WITH LOGIN PASSWORD 'palpo_test';"
          sudo -u postgres createdb -O palpo_test palpo_test
          cargo test -p palpo --all-features database_ -- --ignored --test-threads=1

      - name: Database provider lifecycle regressions
        timeout-minutes: 10
        shell: bash
        run: |
          # These tests own local one-connection pools and need no Palpo schema
          # or process-global configuration. Pool/provider code has no feature gates.
          database=palpo_provider_lifecycle
          sudo -u postgres createdb -O palpo_test "$database"
          # A substring filter can pass with zero matches; assert all five cases.
          registered="$(cargo test --locked -p palpo-data --lib pool::tests:: -- --list --ignored)"
          cases=(
            one_connection_supports_nested_queries_and_concurrent_handles
            failed_and_cancelled_queries_return_their_leases
            transaction_helpers_share_one_lease_and_rollback_releases_it
            snapshot_builder_preserves_isolation_and_releases_before_follow_up_queries
            cancelling_transaction_releases_locks_without_a_later_checkout
          )
          for test in "${cases[@]}"; do
            grep -Fx "pool::tests::$test: test" <<< "$registered"
          done
          PALPO_TEST_DATABASE_URL="postgres://palpo_test:palpo_test@localhost/$database" \
            cargo test --locked -p palpo-data --lib pool::tests:: -- --ignored --test-threads=1

      - name: Compile isolated review test binaries
        timeout-minutes: 30
        run: |
          # Keep cold compilation outside the database regressions' runtime budget.
          # These library targets and feature modes match the exact-case runs below.
          cargo test --locked -p palpo --lib --no-run
          cargo test --locked -p palpo --lib --all-features --no-run

      - name: Security, protocol and resource review regressions
        timeout-minutes: 30
        shell: bash
        run: |
          # Configuration and pools are process-global. Give each exact case
          # its own process and empty database in both supported feature modes.
          cases=(
            routing::client::room::state::state_snapshot_tests::review_state_gets_share_departure_snapshot_and_rejoin_boundary
            routing::client::media::upload_tests::http_reserved_media_enforces_owner_and_safe_download_headers
            media::upload::tests::review_reserved_upload_serializes_and_recovers_storage_and_db_failures
            server_key::validity::tests::review_event_verification_enforces_cached_key_expiry
            server_key::validity::tests::review_local_retired_key_obeys_event_expiry_without_refresh
            server_key::validity::tests::review_event_cache_refreshes_from_programmable_notary
            server_key::notary_tests::review_notary_routes_verify_attestations_and_separate_request_from_event_keys
            server_key::history_capacity_tests::review_verified_history_capacity_and_snapshot_restore
            sending::tests::federation_send_with_one_permit_makes_progress_and_returns_permits
            user::pusher::tests::review_rejected_gateway_keys_only_remove_matching_pusher
            sending::delivery_tests::http_push_retries_failed_gateway_without_acknowledging_queue
            sending::guard::tests::review_sender_survives_ack_failure_and_recovers_startup_failure
            sending::tests::review_queue_batch_is_atomic_and_preserves_payloads
            user::key::publication_tests::review_key_change_publication_fence_survives_commit_rollback_and_cancellation
            sending::guard::readiness_tests::review_readiness_http_tracks_pool_and_sender_recovery_without_breaking_liveness
            routing::client::key::key_changes_tests::review_keys_changes_tracks_shared_encrypted_membership_windows
            directory::tests::review_public_rooms_filters_networks_and_bidirectional_pages
            room::timeline::batch_tests::review_timeline_batch_preserves_events_and_bounds_storage_queries
            directory::batch_tests::review_public_directory_batching_preserves_pages_and_measures_queries
            sending::pdu_batch_tests::review_federation_pdu_batch_preserves_semantics_and_measures_queries
            sending::guard::selection_tests::review_outbound_windows_are_bounded_and_acknowledged_atomically
            sending::guard::selection_tests::review_outbound_scheduler_is_fair_under_slow_claim_and_ack
            sending::guard::selection_tests::review_outbound_scheduler_preserves_wakeup_during_empty_probe
            observability::tests::review_outbound_diagnostics_tracks_queue_pool_failures_and_restored_rows
            observability::tests::review_outbound_process_restart_preserves_requests_and_reports_recovery
            routing::capability_contract_tests::review_threepid_capabilities_and_rejections_match_routes
            routing::capability_contract_tests::review_thirdparty_queries_track_live_appservice_disable
            routing::thirdparty_peer_tests::review_thirdparty_queries_isolate_failed_peers_and_preserve_instances
            routing::federation::tests::review_onbind_respects_disabled_federation
            media::preview::resource_tests::review_preview_requests_reclaim_failed_urls_and_deduplicate
          )
          # The shared PostgreSQL batch selects this substring, including in
          # module names. Global-owning cases must never enter that process.
          for test in "${cases[@]}"; do
            if [[ "$test" == *database_* ]]; then
              echo "::error::Isolated case also matches the shared database filter: $test"
              exit 1
            fi
          done
          for mode in default all; do
            features=()
            if [ "$mode" = all ]; then features+=(--all-features); fi
            cargo test --locked -p palpo --lib "${features[@]}" --no-run
            # These resource lifecycle cases need no database and must also run
            # with default features (the workspace suite uses all features).
            for module in media::preview::resource_tests::review_preview_ hoops::rate_limit_tests::review_rate_limit_ readiness::tests::review_readiness_; do
              cargo test --locked -p palpo --lib "${features[@]}" "$module"
            done
            index=0
            for test in "${cases[@]}"; do
              database="palpo_review_${mode}_${index}"
              sudo -u postgres createdb -O palpo_test "$database"
              # --exact can succeed with zero matches; assert registration too.
              cargo test --locked -p palpo --lib "${features[@]}" "$test" -- --list --ignored --exact | grep -F "$test: test"
              PALPO_TEST_DATABASE_URL="postgres://palpo_test:palpo_test@localhost/$database" \
                cargo test --locked -p palpo --lib "${features[@]}" "$test" -- --ignored --exact --test-threads=1
              index=$((index + 1))
            done
          done

      - name: Embedding startup PostgreSQL regression
        timeout-minutes: 10
        run: |
          # The embedding suite owns its pools/startup globals and has a distinct
          # database variable. Its child process also requires an empty database.
          for mode in default all; do
            features=()
            if [ "$mode" = all ]; then features+=(--all-features); fi
            database="palpo_embedding_${mode}"
            test=tests::embedding_startup_retries_postgres
            sudo -u postgres createdb -O palpo_test "$database"
            cargo test --locked -p palpo --lib "${features[@]}" "$test" -- --list --ignored --exact | grep -F "$test: test"
            PALPO_EMBEDDING_TEST_DATABASE_URL="postgres://palpo_test:palpo_test@localhost/$database" \
              cargo test --locked -p palpo --lib "${features[@]}" "$test" -- --ignored --exact --test-threads=1
          done

      - name: Appservice fixed-device HTTP regression tests
        run: |
          sudo -u postgres createdb -O palpo_test palpo_appservice_device_default
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_appservice_device_default cargo test -p palpo --lib http_appservice_device_put_preserves_requested_identity -- --ignored --exact routing::client::device::device_update_ownership_tests::http_appservice_device_put_preserves_requested_identity
          sudo -u postgres createdb -O palpo_test palpo_appservice_device_all
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_appservice_device_all cargo test -p palpo --lib --all-features http_appservice_device_put_preserves_requested_identity -- --ignored --exact routing::client::device::device_update_ownership_tests::http_appservice_device_put_preserves_requested_identity

      - name: Revised presence regression tests
        run: |
          sudo -u postgres createdb -O palpo_test palpo_revised_presence
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_revised_presence cargo test -p palpo --lib --all-features durable_multidevice_overrides_status_and_remote_recovery -- --ignored
          sudo -u postgres createdb -O palpo_test palpo_revised_presence_disabled
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_revised_presence_disabled cargo test -p palpo --lib --all-features disabled_revised_presence_does_not_publish_saved_clients -- --ignored
      - name: Incremental member presence regression tests
        run: |
          sudo -u postgres createdb -O palpo_test palpo_member_presence_default
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_member_presence_default cargo test -p palpo --lib http_incremental_member_presence_survives_other_sync_and_member_filters -- --ignored --exact sync_v3::member_presence_tests::http_incremental_member_presence_survives_other_sync_and_member_filters
          sudo -u postgres createdb -O palpo_test palpo_member_presence_all
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_member_presence_all cargo test -p palpo --lib --all-features http_incremental_member_presence_survives_other_sync_and_member_filters -- --ignored --exact sync_v3::member_presence_tests::http_incremental_member_presence_survives_other_sync_and_member_filters

      - name: V3 sync response filter regression tests
        run: |
          sudo -u postgres createdb -O palpo_test palpo_sync_filter_default
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_sync_filter_default cargo test -p palpo --lib -- --ignored --exact sync_v3::member_presence_tests::http_sync_filters_room_presence_and_global_account_data
          sudo -u postgres createdb -O palpo_test palpo_sync_filter_all
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_sync_filter_all cargo test -p palpo --lib --all-features -- --ignored --exact sync_v3::member_presence_tests::http_sync_filters_room_presence_and_global_account_data

      - name: Delayed membership publication regression tests
        run: |
          sudo -u postgres createdb -O palpo_test palpo_member_publication_default
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_member_publication_default cargo test -p palpo --lib http_delayed_membership_promotion_uses_publication_order -- --ignored --exact sync_v3::member_presence_tests::http_delayed_membership_promotion_uses_publication_order
          sudo -u postgres createdb -O palpo_test palpo_member_publication_all
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_member_publication_all cargo test -p palpo --lib --all-features http_delayed_membership_promotion_uses_publication_order -- --ignored --exact sync_v3::member_presence_tests::http_delayed_membership_promotion_uses_publication_order
      - name: Default-feature publication cursor consumers
        run: |
          sudo -u postgres createdb -O palpo_test palpo_publication_members_default
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_publication_members_default cargo test -p palpo --lib -- --ignored --exact routing::client::room::membership::publication_tests::database_members_publication_points_preserve_snapshot_and_leave_cap --test-threads=1
          sudo -u postgres createdb -O palpo_test palpo_publication_members_initial_default
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_publication_members_initial_default cargo test -p palpo --lib -- --ignored --exact routing::client::room::membership::publication_tests::database_members_initial_sync_prev_batch_preserves_members_point --test-threads=1
          sudo -u postgres createdb -O palpo_test palpo_publication_members_partial_default
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_publication_members_partial_default cargo test -p palpo --lib -- --ignored --exact routing::client::room::membership::publication_tests::database_sync_join_period_uses_only_available_member_proof --test-threads=1
          sudo -u postgres createdb -O palpo_test palpo_publication_relations_default
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_publication_relations_default cargo test -p palpo --lib -- --ignored --exact room::pdu_metadata::publication_tests::database_relations_preserve_publication_windows_and_legacy_identity_pages --test-threads=1

      - name: Default-feature idle fallback key regression
        run: |
          sudo -u postgres createdb -O palpo_test palpo_idle_fallback
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_idle_fallback cargo test -p palpo --lib routing::client::key::fallback_tests::database_normal_fallback_upload_claim_and_sync_lifecycle -- --ignored --exact --test-threads=1

      - name: Profile avatar HTTP regression test
        run: |
          sudo -u postgres createdb -O palpo_test palpo_profile_avatar
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_profile_avatar cargo test -p palpo --lib --all-features profile_http_avatar_updates -- --ignored --exact routing::client::profile::avatar_http_tests::profile_http_avatar_updates_preserve_opaque_values_and_ownership


      - name: Dummy registration policy regression tests
        run: |
          # Configuration is immutable; give each policy its own process and empty database.
          for policy in open token email closed; do
            case "$policy" in
              open) test=http_dummy_registration_open_policy ;;
              *) test=http_dummy_registration_preserves_${policy}_policy ;;
            esac
            sudo -u postgres createdb -O palpo_test palpo_dummy_${policy}
            PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_dummy_${policy} \
              cargo test -p palpo --lib --all-features \
              routing::client::register::dummy_registration_tests::${test} -- --exact --ignored
          done

      - name: Incomplete missing-event recovery regression test
        run: |
          sudo -u postgres createdb -O palpo_test palpo_missing_events
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_missing_events cargo test -p palpo --lib --all-features missing_events_http_recovery_requires_usable_predecessors -- --ignored --exact event::outlier::missing_events_tests::missing_events_http_recovery_requires_usable_predecessors
          sudo -u postgres createdb -O palpo_test palpo_pending_auth_events
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_pending_auth_events cargo test -p palpo --lib --all-features missing_events_signed_predecessors_preserve_pending_state -- --ignored --exact event::outlier::missing_events_tests::missing_events_signed_predecessors_preserve_pending_state

      - name: Remote device version HTTP regression test
        run: |
          sudo -u postgres createdb -O palpo_test palpo_remote_device_versions
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_remote_device_versions \
            cargo test -p palpo --lib --all-features \
            routing::federation::transaction::device_version_tests::http_remote_device_versions_are_durable_and_idempotent \
            -- --exact --ignored
          sudo -u postgres createdb -O palpo_test palpo_remote_device_many_rooms
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_remote_device_many_rooms \
            cargo test -p palpo --lib --all-features \
            routing::federation::transaction::device_version_tests::http_remote_device_versions_cover_many_shared_rooms \
            -- --exact --ignored

      - name: Join device notification producer regression test
        run: |
          sudo -u postgres createdb -O palpo_test palpo_join_device_versions
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_join_device_versions \
            cargo test -p palpo --lib --all-features \
            membership::join::device_list_producer_tests::http_join_device_list_version_matches_other_producers \
            -- --exact --ignored

      - name: Initial remote device snapshot race regression test
        run: |
          sudo -u postgres createdb -O palpo_test palpo_remote_device_snapshot
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_remote_device_snapshot \
            cargo test -p palpo --lib --all-features \
            routing::federation::transaction::device_version_tests::http_join_snapshot_preserves_device_version_races \
            -- --exact --ignored

      - name: Timestamp gap recovery regression test
        run: |
          sudo -u postgres createdb -O palpo_test palpo_timestamp_gaps
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_timestamp_gaps cargo test -p palpo --lib --all-features timestamp_gap_http_recovery_is_idempotent -- --ignored --exact room::state::gap_tests::timestamp_gap_http_recovery_is_idempotent

      - name: Large atomic to-device delivery regression
        run: |
          sudo -u postgres createdb -O palpo_test palpo_bulk_to_device
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_bulk_to_device cargo test -p palpo-data --lib database_large_to_device_transaction_chunks_and_rolls_back -- --ignored --exact room::transaction_id::bulk_tests::database_large_to_device_transaction_chunks_and_rolls_back

      - name: Message retention regression tests
        run: |
          sudo -u postgres createdb -O palpo_test palpo_retention_on
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_retention_on cargo test -p palpo --lib --all-features retention_http_expiry -- --ignored
          sudo -u postgres createdb -O palpo_test palpo_retention_review
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_retention_review cargo test -p palpo --lib --all-features retention_http_purge_queue -- --ignored
          sudo -u postgres createdb -O palpo_test palpo_retention_off
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_retention_off cargo test -p palpo --lib --all-features retention_http_disabled -- --ignored

      - name: Profile discovery regression test
        run: |
          sudo -u postgres createdb -O palpo_test palpo_profile_lookup
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_profile_lookup cargo test -p palpo --lib --all-features profile_lookup_routes -- --ignored

      - name: OAuth administration scope regression tests
        run: |
          sudo -u postgres createdb -O palpo_test palpo_oauth_scopes_on
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_oauth_scopes_on cargo test -p palpo --lib --all-features oauth_admin_routes -- --ignored
          sudo -u postgres createdb -O palpo_test palpo_oauth_scopes_off
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_oauth_scopes_off cargo test -p palpo --lib oauth_admin_routes -- --ignored
          sudo -u postgres createdb -O palpo_test palpo_oauth_step_up
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_oauth_step_up cargo test -p palpo --lib --all-features oauth_step_up_routes -- --ignored

      - name: Recovery signature retries and concurrent key-change markers
        run: |
          sudo -u postgres createdb -O palpo_test palpo_crypto_test_idempotency
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_crypto_test_idempotency \
            cargo test --locked -p palpo-data --lib -- \
            --ignored --exact user::key::recovery_idempotency_tests::cross_signing_retries_and_key_change_markers_are_atomic
