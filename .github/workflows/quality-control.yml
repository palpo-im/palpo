name: Quality control

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.rs'                 # only execute on changes to go files
      - '**/Cargo.toml'         # or dependency updates
      - 'Cargo.lock'            # or lockfile updates
      - 'deny.toml'             # or supply-chain policy changes
      - '.github/workflows/**'  # or workflow changes
  push:
    branches:
      - main
    paths:
      - '**.rs'                 # only execute on changes to go files
      - '**/Cargo.toml'         # or dependency updates
      - 'Cargo.lock'            # or lockfile updates
      - 'deny.toml'             # or supply-chain policy changes
      - '.github/workflows/**'  # or workflow changes

jobs:
  typos:
    name: Check typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Typos check with custom config file
        uses: crate-ci/typos@v1.51.1

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Feature unification is configured in deny.toml ([graph] all-features).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: ""

  lint:
    name: Rustfmt and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustfmt.toml enables unstable options (unstable_features = true),
      # which only nightly rustfmt honors.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt
      - uses: dtolnay/rust-toolchain@master
        with:
          # Rust 1.99 falsely lints Diesel's generated QueryableByName code:
          # https://github.com/rust-lang/rust-clippy/issues/17525
          # Keep linting strict; the build/test job below still uses latest stable.
          toolchain: 1.98.1
          components: clippy

      - name: Install dependencies
        run: "sudo apt update && sudo apt install -y --no-install-recommends libclang-dev libpq-dev cmake"

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
        fail-fast: false
        matrix:
          version:
            - stable
    name: Cargo check ${{ matrix.version }} - x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.version }}
          components: rustfmt, clippy

      - name: Install dependencies
        run: "sudo apt update && sudo apt install -y --no-install-recommends libclang-dev libpq-dev cmake postgresql postgresql-contrib"

      - name: Check build
        run: cargo check --all --bins --examples --tests

      - name: Check release build
        run: cargo check --all --bins --examples --tests --release

      - name: Cargo test
        timeout-minutes: 40
        run: cargo test --all --all-features --no-fail-fast -- --nocapture

      - name: PostgreSQL regression tests
        env:
          PALPO_TEST_DATABASE_URL: postgres://palpo_test:palpo_test@localhost/palpo_test
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE palpo_test WITH LOGIN PASSWORD 'palpo_test';"
          sudo -u postgres createdb -O palpo_test palpo_test
          cargo test -p palpo --all-features database_ -- --ignored --test-threads=1

      - name: Profile avatar HTTP regression test
        run: |
          sudo -u postgres createdb -O palpo_test palpo_profile_avatar
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_profile_avatar cargo test -p palpo --lib --all-features profile_http_avatar_updates -- --ignored --exact routing::client::profile::avatar_http_tests::profile_http_avatar_updates_preserve_opaque_values_and_ownership

      - name: Dummy registration policy regression tests
        run: |
          # Configuration is immutable; give each policy its own process and empty database.
          for policy in open token email closed; do
            case "$policy" in
              open) test=http_dummy_registration_open_policy ;;
              *) test=http_dummy_registration_preserves_${policy}_policy ;;
            esac
            sudo -u postgres createdb -O palpo_test palpo_dummy_${policy}
            PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_dummy_${policy} \
              cargo test -p palpo --lib --all-features \
              routing::client::register::dummy_registration_tests::${test} -- --exact --ignored
          done

      - name: Incomplete missing-event recovery regression test
        run: |
          sudo -u postgres createdb -O palpo_test palpo_missing_events
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_missing_events cargo test -p palpo --lib --all-features missing_events_http_recovery_requires_usable_predecessors -- --ignored --exact event::outlier::missing_events_tests::missing_events_http_recovery_requires_usable_predecessors
          sudo -u postgres createdb -O palpo_test palpo_pending_auth_events
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_pending_auth_events cargo test -p palpo --lib --all-features missing_events_signed_predecessors_preserve_pending_state -- --ignored --exact event::outlier::missing_events_tests::missing_events_signed_predecessors_preserve_pending_state

      - name: Message retention regression tests
        run: |
          sudo -u postgres createdb -O palpo_test palpo_retention_on
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_retention_on cargo test -p palpo --lib --all-features retention_http_expiry -- --ignored
          sudo -u postgres createdb -O palpo_test palpo_retention_review
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_retention_review cargo test -p palpo --lib --all-features retention_http_purge_queue -- --ignored
          sudo -u postgres createdb -O palpo_test palpo_retention_off
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_retention_off cargo test -p palpo --lib --all-features retention_http_disabled -- --ignored

      - name: OAuth administration scope regression tests
        run: |
          sudo -u postgres createdb -O palpo_test palpo_oauth_scopes_on
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_oauth_scopes_on cargo test -p palpo --lib --all-features oauth_admin_routes -- --ignored
          sudo -u postgres createdb -O palpo_test palpo_oauth_scopes_off
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_oauth_scopes_off cargo test -p palpo --lib oauth_admin_routes -- --ignored
          sudo -u postgres createdb -O palpo_test palpo_oauth_step_up
          PALPO_TEST_DATABASE_URL=postgres://palpo_test:palpo_test@localhost/palpo_oauth_step_up cargo test -p palpo --lib --all-features oauth_step_up_routes -- --ignored
