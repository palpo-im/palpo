name: Account approvals

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'crates/operations/**'
      - 'crates/core/**'
      - 'crates/core-macros/**'
      - 'crates/identifiers-validation/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/operations-rust.yml'
  push:
    branches: [main]
    paths:
      - 'crates/operations/**'
      - 'crates/core/**'
      - 'crates/core-macros/**'
      - 'crates/identifiers-validation/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/operations-rust.yml'

jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev cmake
      - name: Scoped formatting
        run: cargo +nightly fmt -p palpo-operations -- --check
      - name: Account approval and session tests
        run: cargo +stable test --locked -p palpo-operations
      - name: Scoped Clippy
        run: cargo +stable clippy --locked -p palpo-operations --all-targets -- -D warnings
      - name: Build the Rust executable
        run: cargo +stable build --locked -p palpo-operations
