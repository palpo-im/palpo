name: Rust Operations

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'crates/hagency-contract/**'
      - 'crates/operations/**'
      - 'web-admin/lib/store.mjs'
      - 'web-admin/lib/service.mjs'
      - 'web-admin/lib/outbound.mjs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/operations-rust.yml'
  push:
    branches: [main]
    paths:
      - 'crates/hagency-contract/**'
      - 'crates/operations/**'
      - 'web-admin/lib/store.mjs'
      - 'web-admin/lib/service.mjs'
      - 'web-admin/lib/outbound.mjs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/operations-rust.yml'

jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Scoped formatting
        run: cargo +nightly fmt -p palpo-hagency-contract -p palpo-operations -- --check
      - name: Coordinator contract and Rust service tests
        run: cargo +stable test --locked -p palpo-hagency-contract -p palpo-operations
      - name: Scoped Clippy
        run: cargo +stable clippy --locked -p palpo-hagency-contract -p palpo-operations --all-targets -- -D warnings
      - name: Build the Rust executable
        run: cargo +stable build --locked -p palpo-operations
      - name: Node database migration and Rust process smoke test
        run: python3 crates/operations/tests/node_migration.py --node node --binary target/debug/palpo-operations
