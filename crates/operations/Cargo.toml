[package]
name = "palpo-operations"
description = "Optional Matrix account signup approvals and scoped administration sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
palpo-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rand.workspace = true
chrono.workspace = true
aes-gcm = "=0.11.1"
sha2.workspace = true
subtle = "2.6.1"
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["signal", "time", "net", "sync"] }
salvo = { workspace = true, features = ["test", "affix-state", "size-limiter"] }
# Keep checked timestamp conversions and support existing database writer fences.
rusqlite = { version = "=0.40.2", features = ["bundled", "functions", "fallible_uint"] }

[dev-dependencies]
tempfile.workspace = true
